{% extends 'admin/base_site.html' %}

{% block content %}
<h1>THỐNG KÊ SẢN PHẨM THEO DANH MỤC</h1>

<ul>
    {% for c in course_stats %}
    <li><strong>{{ c.id }} - {{ c.name }}</strong> có {{ c.product_count }} sản phẩm</li>
    {% endfor %}
</ul>

<div style="width: 50%">
    <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let labels = [];
    let data = [];
    {% for c in course_stats %}
        labels.push('{{ c.name }}');
        data.push({{ c.product_count }});
    {% endfor %}

    window.onload = function() {
        const ctx = document.getElementById('myChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Số lượng sản phẩm',
                    data: data,
                    borderWidth: 1,
                    backgroundColor: ['red', 'green', 'blue', 'yellow', 'orange']
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
</script>
{% endblock %}
