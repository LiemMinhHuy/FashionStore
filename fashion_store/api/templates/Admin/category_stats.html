{% extends 'admin/base_site.html' %}

{% block content %}
<h1>THỐNG KÊ THÔNG TIN CÁC BIỂU ĐỒ</h1>

<ul>
    {% for c in course_stats %}
    <li><strong>{{ c.id }} - {{ c.name }}</strong> có {{ c.c }} sản phẩm
    </li>
    {% endfor %}
</ul>

<div style="width: 50%">
    <canvas id="productChart"></canvas>
</div>

<div style="width: 50%">
    <canvas id="categoryChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Biểu đồ thống kê số lượng sản phẩm
    let productLabels = [];
    let productData = [];
    {% for c in course_stats %}
        productLabels.push('{{ c.name }}');
        productData.push({{ c.c }});
    {% endfor %}

    // Biểu đồ thống kê sản phẩm
    const productCtx = document.getElementById('productChart');
    new Chart(productCtx, {
        type: 'bar',
        data: {
            labels: productLabels,
            datasets: [{
                label: 'Số lượng sản phẩm',
                data: productData,
                borderWidth: 1,
                backgroundColor: ['red', 'green', 'blue', 'yellow', 'orange', 'purple', 'cyan']
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    // Biểu đồ thống kê danh mục (ví dụ thống kê số lượng sản phẩm theo danh mục)
    let categoryLabels = [];
    let categoryData = [];
    {% for c in course_stats %}
        categoryLabels.push('{{ c.name }}');
        categoryData.push({{ c.c }});
    {% endfor %}

    // Biểu đồ thống kê danh mục
    const categoryCtx = document.getElementById('categoryChart');
    new Chart(categoryCtx, {
        type: 'pie',
        data: {
            labels: categoryLabels,
            datasets: [{
                label: 'Số lượng sản phẩm theo danh mục',
                data: categoryData,
                backgroundColor: ['red', 'green', 'blue', 'yellow', 'orange', 'purple', 'cyan']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });
</script>
{% endblock %}
